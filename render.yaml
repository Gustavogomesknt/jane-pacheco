# Blueprint do Render para a API (.NET em Docker, plano gratuito).
# Banco e fotos ficam no Neon (Postgres), porque o disco do plano gratuito é apagado a cada reinício.
services:
  - type: web
    name: janepacheco-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Default
        sync: false          # cole a connection string do Neon
      - key: Cors__Origins__0
        sync: false          # URL do site, ex.: https://janepacheco.pages.dev
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: janepacheco-api
